name: Build & Push Docker Image to GHCR
# 触发条件：push到main分支时自动运行；也支持手动触发
on:
  push:
    branches: [ main ]
  workflow_dispatch: # 允许在GitHub页面手动点击运行

# 权限：给内置token写packages包权限，用来上传镜像
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 拉取源码
        uses: actions/checkout@v4

      - name: 设置Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录GHCR容器仓库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ shturl.cc/eG }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/lxkovo/librecrawl:latest
          # 如果需要commit哈希版本标签，可以再加一行
          # tags: ghcr.io/lxkovo/librecrawl:latest,ghcr.io/lxkovo/librecrawl:${{ github.sha }}
